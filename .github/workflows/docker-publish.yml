name: Publish web image

on:
  push:
    branches: [main]
    paths: ['docker/web/**', 'docker/db/**', 'src/**', '.github/workflows/docker-publish.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-web
          tags: |
            type=raw,value=latest
            type=sha,prefix=
      - uses: docker/build-push-action@v6
        with:
          context: docker/web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - id: metadb
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-db
          tags: |
            type=raw,value=latest
            type=sha,prefix=
      - name: Database image (PostgreSQL 18 with pgaudit)
        uses: docker/build-push-action@v6
        with:
          context: docker/db
          push: true
          tags: ${{ steps.metadb.outputs.tags }}
          labels: ${{ steps.metadb.outputs.labels }}
