ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Plain HTTP only redirects to HTTPS.
<VirtualHost *:80>
    Redirect permanent / https://localhost:8443/
</VirtualHost>

<VirtualHost *:443>
    DocumentRoot /srv/grants/public

    SSLEngine on
    SSLCertificateFile    /run/grants/tls/server.crt
    SSLCertificateKeyFile /run/grants/tls/server.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder on

    # public/ is the single web root. Everything else (src, config, SQL,
    # backups, keys, logs) lives outside it and cannot be requested.
    <Directory /srv/grants/public>
        Require all granted
        AllowOverride None
        Options -Indexes -ExecCGI
        FallbackResource /index.php
    </Directory>

    Header always set Strict-Transport-Security "max-age=31536000"
    ErrorLog  /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
