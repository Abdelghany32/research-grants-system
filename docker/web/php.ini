; Lab overrides on top of php.ini-production.
expose_php = Off
display_errors = Off
log_errors = On
error_log = /srv/grants/logs/php-error.log
date.timezone = UTC
allow_url_fopen = Off
allow_url_include = Off
session.save_path = /var/lib/grants/sessions
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.gc_maxlifetime = 1800
