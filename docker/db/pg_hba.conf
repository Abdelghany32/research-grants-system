# PostgreSQL client authentication for the grants lab. First match wins;
# a connection that matches no line is rejected.
# TYPE    DATABASE                                          USER            ADDRESS   METHOD

# Cluster administration: only the OS user "postgres" inside the container.
local     all                                               postgres                  peer

# Backup account: local socket only, password required, never over the network.
local     grants,grants_test,grants_restore,grants_drill    grants_backup             scram-sha-256

# Runtime and audit-reader accounts: TLS + SCRAM, from the compose network only.
hostssl   grants,grants_test,grants_restore,grants_drill    grants_app      samenet   scram-sha-256
hostssl   grants,grants_test,grants_restore,grants_drill    grants_auditor  samenet   scram-sha-256
hostssl   grants,grants_test,grants_restore,grants_drill    grants_audit_write samenet scram-sha-256
hostssl   grants,grants_test,grants_restore,grants_drill    grants_notifier samenet   scram-sha-256
hostssl   grants,grants_test,grants_restore,grants_drill    grants_identity samenet   scram-sha-256

# Everything else is refused explicitly (documentation of intent).
host      all                                               all             all       reject
