# --- grants lab hardening (appended to postgresql.conf at first init) ---
listen_addresses = '*'            # container network only; no host port is published
ssl = on
ssl_min_protocol_version = 'TLSv1.2'
password_encryption = 'scram-sha-256'
timezone = 'UTC'
log_timezone = 'UTC'
log_connections = on
log_disconnections = on
log_statement = 'ddl'
log_lock_waits = on
log_line_prefix = '%m [%p] %q%u@%d '
